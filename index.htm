<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PANADERO SUPREMO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
  body{background:#1a1207;color:#fff;font-family:'Fredoka',system-ui;overflow:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
  #top{width:100%;max-width:860px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:1px;line-height:1.2;text-shadow:2px 2px 0 #000}
  h1 span{color:#ffcc33}
  #hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
  .bar{width:110px;height:14px;background:#000;border:2px solid #fff;border-radius:999px;overflow:hidden;position:relative;box-shadow:2px 2px 0 #000}
  .fill{height:100%;transition:width .2s}
  #vidaFill{background:linear-gradient(90deg,#ff3b30,#ff7a45)}
  #panFill{background:linear-gradient(90deg,#f5d76e,#ff9f1c)}
  #scoreBox,#levelBox{background:#000;border:2px solid #fff;border-radius:8px;padding:4px 8px;font-family:'Press Start 2P',monospace;font-size:10px;box-shadow:2px 2px 0 #000}
  #wrap{position:relative;width:100%;max-width:860px;aspect-ratio:800/400;background:#000;border:4px solid #fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 0 #000, 0 0 0 4px #000;touch-action:none}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);text-align:center;padding:20px;z-index:5}
  #overlay h2{font-family:'Press Start 2P';font-size:22px;margin-bottom:12px;text-shadow:3px 3px 0 #000;line-height:1.2}
  #overlay p{max-width:480px;font-size:18px;line-height:1.3;margin:6px 0;color:#ffeec2}
  .btn{margin-top:14px;background:#ffcc33;color:#000;border:3px solid #000;border-radius:999px;padding:10px 22px;font-family:'Press Start 2P';font-size:12px;cursor:pointer;box-shadow:0 4px 0 #000;transition:transform .05s}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 #000}
  .btn.alt{background:#fff}
  #touch{width:100%;max-width:860px;display:flex;justify-content:space-between;gap:8px;padding:10px 8px 14px;z-index:3}
  .tcol{display:flex;gap:8px}
  .tbtn{width:62px;height:62px;border-radius:16px;border:3px solid #000;background:rgba(255,255,255,.92);box-shadow:0 5px 0 #000;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .tbtn:active{transform:translateY(5px);box-shadow:0 0 0 #000}
  .tbtn.punch{background:#ffcc33}
  #worldTag{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border:2px solid #fff;border-radius:999px;padding:3px 10px;font-family:'Press Start 2P';font-size:8px;z-index:2;pointer-events:none}
  @media(max-width:600px){h1{font-size:11px}#top{padding:8px}#hud{width:100%}.bar{width:88px}#wrap{border-width:3px;border-radius:10px}.tbtn{width:56px;height:56px;font-size:22px}}
</style>
</head>
<body>
<div id="top">
  <h1>\uD83E\uDD56 <span>PANADERO</span> SUPREMO</h1>
  <div id="hud">
    <div style="display:flex;align-items:center;gap:6px">❤️<div class="bar"><div id="vidaFill" class="fill" style="width:100%"></div></div></div>
    <div style="display:flex;align-items:center;gap:6px">\uD83C\uDF5E<div class="bar"><div id="panFill" class="fill" style="width:70%"></div></div></div>
    <div id="scoreBox">0 PTS</div>
    <div id="levelBox">M1-C1</div>
  </div>
</div>
<div id="wrap">
  <div id="worldTag">BARRIO</div>
  <canvas id="c" width="800" height="400"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">PANADERO SUPREMO</h2>
    <p id="ovText">¡El barrio quiere tu pan! Pelea contra panaderos rivales y lleva el pan perfecto al millonario de la torre.</p>
    <p style="font-size:13px;opacity:.9">A/D o ←→ mover · W/↑/ESPACIO saltar · J golpear<br>¡En móvil usa los botones!</p>
    <button class="btn" id="startBtn">¡AMASAR Y PELEAR! \uD83E\uDD4A</button>
  </div>
</div>
<div id="touch">
  <div class="tcol">
    <div class="tbtn" id="bLeft">◀</div>
    <div class="tbtn" id="bRight">▶</div>
  </div>
  <div class="tcol">
    <div class="tbtn" id="bJump">⬆</div>
    <div class="tbtn punch" id="bPunch">\uD83E\uDD56</div>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const startBtn = document.getElementById('startBtn');
const vidaFill = document.getElementById('vidaFill');
const panFill = document.getElementById('panFill');
const scoreBox = document.getElementById('scoreBox');
const levelBox = document.getElementById('levelBox');
const worldTag = document.getElementById('worldTag');

const WORLDS = [
  {name:'BARRIO', bg:['#87c1ff','#ffe29a'], ground:'#7a4a2a', ground2:'#5a3320', accent:'#ffcc33', emoji:'\uD83C\uDFD8️'},
  {name:'FERIA', bg:['#ff9a9e','#fecfef'], ground:'#8b5e3c', ground2:'#6d4128', accent:'#ff6b6b', emoji:'\uD83C\uDFAA'},
  {name:'FABRICA ROBOT', bg:['#434343','#000000'], ground:'#3a3a3a', ground2:'#222', accent:'#00ffd0', emoji:'\uD83E\uDD16'},
  {name:'DESIERTO HARINA', bg:['#fff1b8','#f8d29a'], ground:'#e8c99a', ground2:'#d3b27d', accent:'#ffffff', emoji:'\uD83C\uDFDC️'},
  {name:'TORRE MILLONARIO', bg:['#0f0c29','#302b63'], ground:'#1e1e2f', ground2:'#151528', accent:'#ffd700', emoji:'\uD83C\uDFD9️'},

let keys = {};

let gameState='menu';
let world=0, chapter=0;

function resetGame(){

}
function levelNumber(){return world*4+chapter+1}
function getWorld(){return WORLDS[world]}

function startLevel(){
  const isBoss = chapter===3;
  enemies=[]; particles=[]; pops=[]; breads=[];
  player = {x:80,y:250,w:36,h:52,vx:0,vy:0,grounded:false,face:1,punch:0,hitCd:0,hurtCd:0};
  const count = isBoss ? 1 : 3 + Math.floor(levelNumber()*0.8) + world;
  for(let i=0;i<count;i++){

  if(!isBoss){
    for(let i=0;i<6;i++) breads.push({x:100+Math.random()*600,y:60+Math.random()*40,s:12+Math.random()*10, rot:Math.random()*6});
  }
  gameState='playing';
  overlay.style.display='none';

function spawnEnemy(isBoss){
  const baseX = 820 + Math.random()*260;
  const boss = !!isBoss;
  enemies.push({
    x:baseX, y: boss? 220: 250, w: boss?74:40, h: boss?86:56,
    vx:0, vy:0, hp: boss? (12+world*4) : (2+Math.floor(world*0.9)+ (chapter>1?1:0)),
    maxHp: boss? (12+world*4) : (2+Math.floor(world*0.9)+ (chapter>1?1:0)),
    grounded:false, face:-1, punch:0, hitCd:0, boss, dead:false, deadT:0,
    type: Math.floor(Math.random()*3)

function punchHit(){
  if(player.punch>0) return;
  player.punch=14;
  player.hitCd=14;
  let hit=false;
  for(let e of enemies){
    if(e.dead) continue;
    const dx = (e.x+e.w/2) - (player.x+player.w/2);
    const dy = Math.abs((e.y+e.h/2)-(player.y+player.h/2));
    const inFront = (player.face===1 && dx>0 && dx<78) || (player.face===-1 && dx<0 && dx>-78);

      e.vx = player.face*6;
      e.vy = -3;
      calidad = Math.min(100, calidad+ (e.boss?8:4));
      score+= e.boss?350:120;
      spawnPow(e.x+e.w/2, e.y-6);
      flourBurst(e.x+e.w/2, e.y+e.h/2, e.boss?28:16);
      if(e.hp<=0){
        e.dead=true; e.deadT=0; score+= e.boss?800:250;
        flourBurst(e.x+e.w/2, e.y+e.h/2, e.boss?48:26);
        for(let k=0;k<6;k++) pops.push({x:e.x+e.w/2+ (Math.random()-0.5)*20, y:e.y, vy:-2-Math.random()*3, t:0, txt:e.boss?'¡K.O.!':'-1', col:e.boss?'#ffd700':'#fff'});

    setTimeout(()=>c.style.transform='none',90);

    flourBurst(player.x+player.w/2 + player.face*28, player.y+24, 8);
  }
}

function spawnPow(x,y){
  const words=['POW!','¡PAM!','¡ZAS!','¡TOMA!','¡ÑAM!'];
  pops.push({x,y,vy:-2.2,t:0,txt:words[Math.floor(Math.random()*words.length)],col:'#ffcc33',big:true});
}
function flourBurst(x,y,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*7, vy:-Math.random()*6-1, r:2+Math.random()*3.5, life:0, max:22+Math.random()*18, col: Math.random()<0.2?'#ffcc33':'#fffbe6'});

function update(){
  if(gameState!=='playing') return;
  // input
  let move=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']||touchLeft) move=-1;
  if(keys['ArrowRight']||keys['d']||keys['D']||touchRight) move=1;
  if(move!==0) player.face=move;
  player.vx = move*4.8;

  if((keys['ArrowUp']||keys['w']||keys['W']||keys[' '] ) && player.grounded){
    player.vy=-11.2; player.grounded=false; keys[' '] = false;

  player.vy+=0.68; player.x+=player.vx; player.y+=player.vy;

  if(player.punch>0) player.punch--; if(player.hitCd>0) player.hitCd--; if(player.hurtCd>0) player.hurtCd--;

  let alive=0;

    if(e.dead){
      e.deadT++; e.vy+=0.6; e.y+=e.vy; e.x+=e.vx*0.92; e.vx*=0.92;

    }

        e.punch=18;
        // hit player
        if(player.hurtCd<=0){
          vida-= e.boss?18:9;
          player.hurtCd=30;
          player.vx = -e.face*5;
          player.vy=-3.5;
          flourBurst(player.x+player.w/2, player.y+24, 12);
          calidad = Math.max(0, calidad- (e.boss?10:5));
          if(vida<=0){

          }

      }
    }
    if(e.punch>0) e.punch--; if(e.hitCd>0) e.hitCd--;
    e.vy+=0.68; e.x+=e.vx; e.y+=e.vy;

    const spawned = enemies.filter(e=>!e.dead || e.deadT>0).length + (enemies.length - alive);
    // if we already spawned all and all dead
    if(enemies.length>=totalShould){

    }

}

function levelWin(){

  }

  chapter++; if(chapter>3){ chapter=0; world++; }
  if(world>=5){ gameOver(true); return; }

function gameOver(win){

  }
